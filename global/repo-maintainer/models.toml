# Models for repo-maintainer runs. The runner reads this file, so it's the only
# place to update when models change. A repo config can override any key in a
# [models] table, e.g. [models.tasks] scan = "worker".

# Tier each task runs at.
[tasks]
prs = "lead"      # reviews other people's code and fixes its own PRs
deps = "lead"     # merge decisions, release notes for major bumps
sync = "lead"     # upstream merge conflicts
scan = "lead"     # finding and fixing inefficiencies
report = "worker" # summarizes the day's run summaries

[claude.lead]
model = "claude-opus-5-5"

[claude.worker]
model = "claude-haiku-5-5"

[codex.lead]
model = "gpt-6.1-sol"
effort = "high"

[codex.worker]
model = "gpt-6-luna"
effort = "medium"
